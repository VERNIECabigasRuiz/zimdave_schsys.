# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Uploaded photos/logos live under <upload_root>/uploads/...
    app.upload_root: '%kernel.project_dir%/public'

    # The school day runs on this clock (Philippines)
    app.timezone: 'Asia/Manila'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Access hooks: every module's account rules, tagged by AccessHookAutoconfiguration (Kernel::build)
    App\Access\Application\UseCase\Handler\UpdateAccountHandler:
        arguments:
            $roleGuards: !tagged_iterator access.role_change_guard

    App\Access\Application\UseCase\Handler\ToggleAccountActiveHandler:
        arguments:
            $reactivationGuards: !tagged_iterator access.reactivation_guard

when@test:
    parameters:
        app.upload_root: '%kernel.project_dir%/var/test_public'

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Handlers the bus integration test dispatches to
        App\Tests\Core\Integration\Bus\Fixture\:
            resource: '../tests/Core/Integration/Bus/Fixture/'

        # Loaded directly by its test
        App\DataFixtures\DemoFixtures:
            public: true

        # Public so tests can fetch the buses from the container
        App\Core\Application\Bus\UseCaseBusInterface:
            alias: App\Core\Infrastructure\Bus\MessengerUseCaseBus
            public: true
        App\Core\Application\Bus\QueryBusInterface:
            alias: App\Core\Infrastructure\Bus\MessengerQueryBus
            public: true
