doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Core:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Domain'
                prefix: 'App\Core\Domain'
                alias: Core
            Access:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Access/Domain'
                prefix: 'App\Access\Domain'
                alias: Access
            Billing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Billing/Domain'
                prefix: 'App\Billing\Domain'
                alias: Billing
            Schools:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Schools/Domain'
                prefix: 'App\Schools\Domain'
                alias: Schools
            Classes:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Classes/Domain'
                prefix: 'App\Classes\Domain'
                alias: Classes
            Learners:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Learners/Domain'
                prefix: 'App\Learners\Domain'
                alias: Learners
            Attendance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Attendance/Domain'
                prefix: 'App\Attendance\Domain'
                alias: Attendance
            Nutrition:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Nutrition/Domain'
                prefix: 'App\Nutrition\Domain'
                alias: Nutrition
            LessonPlans:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/LessonPlans/Domain'
                prefix: 'App\LessonPlans\Domain'
                alias: LessonPlans
            Staff:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Staff/Domain'
                prefix: 'App\Staff\Domain'
                alias: Staff
            Grading:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Grading/Domain'
                prefix: 'App\Grading\Domain'
                alias: Grading

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
