# Layers per module follow the same pattern as Core: <Module>_Domain,
# <Module>_Application, <Module>_Infrastructure, <Module>_Presentation.
# A module's Domain may use the Domain of modules above it; anything else
# goes through <Module>/Application/Api.
imports:
  - deptrac.baseline.yaml

deptrac:
  paths:
    - ../src

  layers:
    - name: Core_Domain
      collectors:
        - type: classLike
          value: ^App\\Core\\Domain\\.*

    - name: Core_Application
      collectors:
        - type: classLike
          value: ^App\\Core\\Application\\.*

    - name: Core_Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Core\\Infrastructure\\(?!Bus\\Attributes\\).*

    # Handler and caching attributes: declared on Application classes, read by Infrastructure
    - name: Core_BusAttributes
      collectors:
        - type: classLike
          value: ^App\\Core\\Infrastructure\\Bus\\Attributes\\.*

    - name: Core_Presentation
      collectors:
        - type: classLike
          value: ^App\\Core\\Presentation\\.*

    - name: Access_Domain
      collectors:
        - type: classLike
          value: ^App\\Access\\Domain\\.*

    - name: Access_Application
      collectors:
        - type: classLike
          value: ^App\\Access\\Application\\.*

    - name: Access_Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Access\\Infrastructure\\.*

    - name: Access_Presentation
      collectors:
        - type: classLike
          value: ^App\\Access\\Presentation\\.*

    - name: Billing_Domain
      collectors:
        - type: classLike
          value: ^App\\Billing\\Domain\\.*

    - name: Billing_Application
      collectors:
        - type: classLike
          value: ^App\\Billing\\Application\\.*

    - name: Billing_Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Billing\\Infrastructure\\.*

    - name: Billing_Presentation
      collectors:
        - type: classLike
          value: ^App\\Billing\\Presentation\\.*

    - name: Kernel
      collectors:
        - type: classLike
          value: ^App\\Kernel$

    # Code not yet moved into a module
    - name: Legacy
      collectors:
        - type: classLike
          value: ^App\\(?!Core\\|Access\\|Billing\\|Kernel$).*

    # The two Symfony interfaces the Access User implements so it can sign in (owner's decision)
    - name: SecurityUserContract
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Security\\Core\\User\\(UserInterface|PasswordAuthenticatedUserInterface)$

    - name: DoctrineMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\(ORM\\Mapping|Common\\Collections)\\.*

    - name: ValidatorConstraints
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Validator\\Constraints\\.*

    - name: Framework
      collectors:
        - type: classLike
          value: ^(Symfony\\(?!Component\\Validator\\Constraints\\|Component\\Security\\Core\\User\\(UserInterface|PasswordAuthenticatedUserInterface)$)|Doctrine\\(?!ORM\\Mapping\\|Common\\Collections\\)|Psr\\|Twig\\|Monolog\\).*

    - name: Vendor
      collectors:
        - type: classLike
          value: ^(Dompdf|PhpOffice|chillerlan|Faker)\\.*

  ruleset:
    Core_Domain:
      - DoctrineMapping
    Core_Application:
      - Core_Domain
      - Core_BusAttributes
      - ValidatorConstraints
    Core_Infrastructure:
      - Core_Domain
      - Core_Application
      - Core_BusAttributes
      - DoctrineMapping
      - ValidatorConstraints
      - Framework
      - Vendor
    Core_Presentation:
      - Core_Application
      - Core_Domain
      - ValidatorConstraints
      - Framework
    Core_BusAttributes: ~
    Access_Domain:
      - Core_Domain
      - DoctrineMapping
      - SecurityUserContract
    Access_Application:
      - Access_Domain
      - Core_Application
      - Core_Domain
      - Core_BusAttributes
      - ValidatorConstraints
    Access_Infrastructure:
      - Access_Domain
      - Access_Application
      - Core_Domain
      - Core_Application
      - Core_BusAttributes
      - DoctrineMapping
      - SecurityUserContract
      - ValidatorConstraints
      - Framework
    Access_Presentation:
      - Access_Application
      - Access_Domain
      - Core_Application
      - Core_Domain
      - Core_Presentation
      - SecurityUserContract
      - ValidatorConstraints
      - Framework
    Billing_Domain:
      - Core_Domain
      - DoctrineMapping
    Billing_Application:
      - Billing_Domain
      - Core_Application
      - Core_Domain
      - Core_BusAttributes
      - ValidatorConstraints
    Billing_Infrastructure:
      - Billing_Domain
      - Billing_Application
      - Core_Domain
      - Core_Application
      - Core_BusAttributes
      - DoctrineMapping
      - ValidatorConstraints
      - Framework
    Billing_Presentation:
      - Billing_Application
      - Billing_Domain
      - Core_Application
      - Core_Domain
      - Core_Presentation
      - Access_Domain
      - ValidatorConstraints
      - Framework
    Kernel:
      - Core_Domain
      - Core_Application
      - Core_Infrastructure
      - Core_BusAttributes
      - Core_Presentation
      - Access_Domain
      - Access_Infrastructure
      - Legacy
      - DoctrineMapping
      - ValidatorConstraints
      - Framework
      - Vendor
    Legacy:
      - Core_Domain
      - Core_Application
      - Core_Infrastructure
      - Core_BusAttributes
      - Core_Presentation
      - Access_Domain
      - Access_Application
      - Access_Infrastructure
      - Access_Presentation
      - Billing_Domain
      - Billing_Application
      - Billing_Infrastructure
      - Billing_Presentation
      - Kernel
      - DoctrineMapping
      - SecurityUserContract
      - ValidatorConstraints
      - Framework
      - Vendor
    SecurityUserContract: ~
    DoctrineMapping: ~
    ValidatorConstraints: ~
    Framework: ~
    Vendor: ~
