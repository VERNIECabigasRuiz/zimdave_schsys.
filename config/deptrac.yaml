          value: ^App\\Nutrition\\Presentation\\.*

    - name: Legacy
      collectors:
        - type: classLike
          value: ^App\\(?!Core\\|Access\\|Billing\\|Schools\\|Classes\\|Learners\\|Attendance\\|Grading\\|Nutrition\\|LessonPlans\\|Staff\\|Announcements\\|Dashboards\\|Kernel$).*

    # The two Symfony interfaces the Access User implements so it can sign in (owner's decision)
    - name: SecurityUserContract
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Security\\Core\\User\\(UserInterface|PasswordAuthenticatedUserInterface)$

    - name: DoctrineMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\(ORM\\Mapping|Common\\Collections)\\.*

    - name: ValidatorConstraints
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Validator\\Constraints\\.*

    - name: Framework
      collectors:
        - type: classLike
          value: ^(Symfony\\(?!Component\\Validator\\Constraints\\|Component\\Security\\Core\\User\\(UserInterface|PasswordAuthenticatedUserInterface)$)|Doctrine\\(?!ORM\\Mapping\\|Common\\Collections\\)|Psr\\|Twig\\|Monolog\\).*

    - name: Vendor
      collectors:
        - type: classLike
          value: ^(Dompdf|PhpOffice|chillerlan|Faker)\\.*

