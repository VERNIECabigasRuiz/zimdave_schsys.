# Layers per module follow the same pattern as Core: <Module>_Domain,
# <Module>_Application, <Module>_Infrastructure, <Module>_Presentation.
# A module's Domain may use the Domain of modules above it; anything else
# goes through <Module>/Application/Api.
imports:
  - deptrac.baseline.yaml

deptrac:
  paths:
    - ../src

  layers:
    - name: Core_Domain
      collectors:
        - type: classLike
          value: ^App\\Core\\Domain\\.*

    - name: Core_Application
      collectors:
        - type: classLike
          value: ^App\\Core\\Application\\.*

    - name: Core_Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Core\\Infrastructure\\(?!Bus\\Attributes\\).*

    # Handler and caching attributes: declared on Application classes, read by Infrastructure
    - name: Core_BusAttributes
      collectors:
        - type: classLike
          value: ^App\\Core\\Infrastructure\\Bus\\Attributes\\.*

    - name: Core_Presentation
      collectors:
        - type: classLike
          value: ^App\\Core\\Presentation\\.*

    - name: Access_Domain
      collectors:
        - type: classLike
          value: ^App\\Access\\Domain\\.*

    - name: Access_Application
      collectors:
        - type: classLike
          value: ^App\\Access\\Application\\(?!Api\\).*

    # What other modules may use from Access
    - name: Access_Api
      collectors:
        - type: classLike
          value: ^App\\Access\\Application\\Api\\.*

    - name: Access_Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Access\\Infrastructure\\.*

    - name: Access_Presentation
      collectors:
        - type: classLike
          value: ^App\\Access\\Presentation\\.*

    - name: Billing_Domain
      collectors:
        - type: classLike
          value: ^App\\Billing\\Domain\\.*

    - name: Billing_Application
      collectors:
        - type: classLike
          value: ^App\\Billing\\Application\\(?!Api\\).*

    # What other modules may use from Billing
