    - name: Billing_Presentation
      collectors:
        - type: classLike
          value: ^App\\Billing\\Presentation\\.*

    - name: Schools_Domain
      collectors:
        - type: classLike
          value: ^App\\Schools\\Domain\\.*

    - name: Schools_Application
      collectors:
        - type: classLike
          value: ^App\\Schools\\Application\\(?!Api\\).*

    # What other modules may use from Schools
